[project]
name = "scholia"
version = "0.1.0"
description = "Local-first practice platform for AI-assisted code comprehension interview rounds."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "gitpython>=3.1.43",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "sqlmodel>=0.0.22",
    "tenacity>=9.0",
    "tokenizers>=0.20",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schema", "corpus", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "problems", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "E722"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["schema.*", "api.grader.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: makes real LLM/network calls; skipped by default"]

[tool.coverage.run]
source = ["schema", "api", "corpus"]
omit = ["api/openapi.py"]  # a three-line CLI that writes the OpenAPI document

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
