server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Model calls can take a while (local model on CPU, judge retries).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # The app is a single-page app with its own router.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
