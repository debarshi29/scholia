<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Scholia</title>
    <script>
      // Apply the stored theme before first paint, so a dark user never sees a light flash.
      (function () {
        var mode = "system";
        try {
          var saved = JSON.parse(localStorage.getItem("scholia-theme") || "null");
          if (saved && saved.state && saved.state.mode) mode = saved.state.mode;
        } catch (e) {}
        var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
